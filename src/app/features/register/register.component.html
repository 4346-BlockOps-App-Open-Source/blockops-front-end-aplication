<section class="register-container">
  <h2>Crear cuenta</h2>
  <form (ngSubmit)="onRegister($event)">
    <div class="form-group">
      <label for="username">Usuario</label>
      <input id="username" type="text" [(ngModel)]="user.username" name="username" required />
    </div>

    <div class="form-group">
      <label for="firstName">Primer nombre</label>
      <input id="firstName" type="text" [(ngModel)]="user.firstName" name="firstName" required />
    </div>

    <div class="form-group">
      <label for="lastName">Apellido</label>
      <input id="lastName" type="text" [(ngModel)]="user.lastName" name="lastName" required />
    </div>

    <div class="form-group">
      <label for="email">Correo</label>
      <input id="email" type="email" [(ngModel)]="user.email" name="email" required />
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input id="password" type="password" [(ngModel)]="user.password" name="password" required />
    </div>

    <div class="form-group">
      <label>Perfil de riesgo</label>
      <div class="options radio-group">
        <label *ngFor="let option of riskProfiles">
          <input type="radio" name="perfilRiesgo" [value]="option" [(ngModel)]="user.perfilRiesgo" required />
          {{ option }}
        </label>
      </div>
    </div>

    <div class="form-group">
      <label>Preferencias</label>
      <select id="preferencias" [(ngModel)]="user.preferencias" name="preferencias" required>
        <option *ngFor="let pref of preferenceChoices" [value]="pref">{{pref}}</option>
      </select>
    </div>

    <div *ngIf="registerError" class="error-message">{{ registerError }}</div>

    <button type="submit" [disabled]="loading">
      {{ loading ? 'Registrando...' : 'Registrar' }}
    </button>
  </form>
</section>
