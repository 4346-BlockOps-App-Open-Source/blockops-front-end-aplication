<div class="forum max-w-4xl mx-auto p-6 space-y-6 text-white font-sans">
  <h2 class="text-3xl font-bold text-cyan-400 border-b-2 border-cyan-500 pb-2">🗣️ Foro de la Comunidad</h2>

  <div class="new-post bg-gradient-to-br from-gray-800 to-gray-900 p-4 rounded-xl shadow-md border border-cyan-700">
    <textarea [(ngModel)]="newPostContent"
              placeholder="Escribe una nueva publicación..."
              class="w-full h-24 p-3 bg-gray-950 border border-cyan-700 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-cyan-500 resize-none">
    </textarea>
    <button (click)="createPost()"
            class="mt-3 px-5 py-2 bg-cyan-500 hover:bg-cyan-600 transition rounded-lg shadow-lg font-semibold text-black">
      📢 Publicar
    </button>
  </div>

  <div *ngFor="let post of posts; index as i"
       class="post-card bg-gradient-to-br from-gray-900 to-black p-5 rounded-xl shadow-lg border border-cyan-700 space-y-4">

    <div class="post-header text-lg font-semibold text-cyan-300">
      <strong>{{ post.author }}</strong> dice:
    </div>

    <div class="post-body bg-gray-800 p-4 rounded-lg text-white shadow-inner">
      {{ post.content }}
    </div>

    <div class="responses space-y-2">
      <div *ngFor="let response of post.responses"
           class="response bg-gray-700 p-3 rounded-md border-l-4 border-cyan-400 text-sm">
        <em class="text-cyan-300">{{ response.author }}:</em> {{ response.content }}
      </div>
    </div>

    <div class="reply-section mt-4">
      <textarea [(ngModel)]="newResponses[i]"
                placeholder="Responder..."
                class="w-full h-20 p-3 bg-gray-950 border border-cyan-700 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-cyan-500 resize-none">
      </textarea>
      <button (click)="respond(i)"
              class="mt-2 px-4 py-2 bg-cyan-500 hover:bg-cyan-600 transition rounded-md font-semibold text-black shadow-md">
        💬 Enviar respuesta
      </button>
    </div>

    <div *ngIf="post.notifications > 0"
         (click)="clearNotification(i)"
         class="notification mt-3 bg-cyan-800/20 hover:bg-cyan-800/40 text-cyan-300 border border-cyan-400 rounded-md p-3 cursor-pointer transition-all text-sm">
      🔔 Tienes {{ post.notifications }} nueva(s) respuesta(s) — clic para marcar como leídas
    </div>
  </div>
</div>
